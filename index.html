<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html5-qrcode Demo | Official Reference</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn-group {
            margin: 12px 0;
        }
        button {
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 8px;
        }
        #qr-reader {
            margin: 16px 0;
            border: 1px solid #ddd;
        }
        #result-area {
            background: #f6f6f6;
            padding: 12px;
            min-height: 120px;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .tip {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>html5-qrcode Scanner Demo</h2>
    <p class="tip">⚠️ 必须通过 HTTP/HTTPS 访问，本地 file:// 协议无法调用摄像头</p>
    <p class="tip">✅ 建议使用 VSCode Live Server 打开测试</p>

    <div class="btn-group">
        <button id="startBtn">启动扫码</button>
        <button id="stopBtn" disabled>关闭扫码</button>
    </div>

    <div id="qr-reader"></div>

    <h4>运行日志 & 扫码结果</h4>
    <div id="result-area"></div>

<script>
    const readerId = "qr-reader";
    let scanner = null;
    let scanning = false;

    const resultArea = document.getElementById("result-area");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        resultArea.innerHTML += `[${time}] ${msg}\n`;
        resultArea.scrollTop = resultArea.scrollHeight;
    }

    /**
     * 销毁扫码实例 + 清空容器DOM
     */
    async function destroyScanner() {
        if (scanner) {
            try {
                await scanner.clear();
                log("✅ 摄像头资源已释放");
            } catch (err) {
                log(`⚠️ 释放异常: ${err.message}`);
            }
            scanner = null;
        }
        const container = document.getElementById(readerId);
        if(container) container.innerHTML = '';

        scanning = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
    }

    /**
     * 初始化扫码器
     */
    function startScan() {
        // 直接读取全局，不再定义同名变量！
        const Html5QrcodeScanner = window.Html5QrcodeScanner;

        if (!Html5QrcodeScanner) {
            log("❌ html5-qrcode 库加载失败，请刷新页面");
            return;
        }
        if (scanning) {
            log("ℹ️ 扫码正在运行中");
            return;
        }
        scanning = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        log("🔍 开始初始化摄像头...");

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            experimentalFeatures: {
                useBarcodeDetector: true
            },
            disableFlip: false
        };

        scanner = new Html5QrcodeScanner(readerId, config, false);

        scanner.render(onScanSuccess, onScanFailure);

        // 汉化提示文字
        setTimeout(() => {
            const el = document.querySelector(`#${readerId}__dashboard_section_csr span`);
            if (el) el.textContent = "将二维码放入取景框内";
        }, 400);
    }

    // 扫码成功回调
    async function onScanSuccess(decodedText) {
        log(`🎉 识别成功：${decodedText}`);
        await destroyScanner();
    }

    // 持续扫描回调
    function onScanFailure() {}

    // 绑定按钮
    startBtn.addEventListener("click", startScan);
    stopBtn.addEventListener("click", async () => {
        log("ℹ️ 用户主动关闭扫码");
        await destroyScanner();
    });

    // 页面就绪日志
    window.addEventListener('load', () => {
        if(window.Html5QrcodeScanner){
            log("✅ html5-qrcode 库加载完成，可以启动扫码");
        }else{
            log("❌ CDN资源加载失败，请检查网络");
        }
    })
</script>
</body>
</html>
