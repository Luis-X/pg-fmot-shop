<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一行代码扫码示例</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 8px; background: #007aff; color: #fff; border: none; }
    </style>
</head>
<body>

    <!-- 1. 点击按钮：一行代码开启扫码 -->
    <button onclick="startScan()">开始扫码</button>
    <div id="result" style="margin-top: 20px;"></div>

    <!-- 引入挂载了全局 $scan 的 JS 模块 -->
    <script type="module" src="./scanner.js"></script>

    <script>
        // 开始扫码（一行核心调用）
        async function startScan() {
            try {
                const code = await window.$scan.open();
                document.getElementById('result').innerText = `扫码结果：${code}`;
            } catch (err) {
                console.log("关闭或取消扫码", err);
            }
        }

        // 如果需要随时在外部代码中关闭扫码，可直接调用：
        // window.$scan.close();
    </script>
</body>
</html>
