<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扫码组件调用</title>
    <!-- 1. 引入 html5-qrcode 库 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- 2. 引入你的 QrScanner.js -->
    <script src="QrScanner.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 120px; background: #f5f5f7; margin: 0; }
        button { padding: 14px 28px; font-size: 16px; font-weight: 600; color: white; background: #007aff; border: none; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 点击按钮：一行代码开启扫码 -->
    <button onclick="window.openQrScanner({ onSuccess: (text) => alert('扫码结果: ' + text) })">扫一扫</button>

</body>
</html>
