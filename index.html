<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码扫描器</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #startBtn { background: #4CAF50; color: white; }
        #stopBtn  { background: #f44336; color: white; }
    </style>
</head>
<body>
    <h1>二维码扫描器</h1>
    
    <div id="reader"></div>
    
    <div>
        <button id="startBtn">开始扫描</button>
        <button id="stopBtn" disabled>停止扫描</button>
    </div>

    <script>
        let html5QrCode = null;

        function onScanSuccess(decodedText, decodedResult) {
            // 扫描成功后弹框提示
            const result = `
                ✅ 扫描成功！
                
                内容：
                ${decodedText}
            `;
            
            if (confirm(result + "\n\n是否继续扫描？")) {
                // 点击确定后继续扫描
                return true;
            } else {
                // 点击取消后停止扫描
                html5QrCode.stop().then(() => {
                    document.getElementById("startBtn").disabled = false;
                    document.getElementById("stopBtn").disabled = true;
                });
            }
        }

        function onScanError(errorMessage) {
            // 扫描过程中正常报错（如没对准）不处理
        }

        // 开始扫描
        document.getElementById("startBtn").addEventListener("click", () => {
            if (html5QrCode) {
                html5QrCode.clear();
            }

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },   // 扫描框大小
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },  // 优先使用后置摄像头
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                document.getElementById("startBtn").disabled = true;
                document.getElementById("stopBtn").disabled = false;
            }).catch(err => {
                alert("启动失败: " + err);
            });
        });

        // 停止扫描
        document.getElementById("stopBtn").addEventListener("click", () => {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById("startBtn").disabled = false;
                    document.getElementById("stopBtn").disabled = true;
                }).catch(err => console.error(err));
            }
        });

        // 页面关闭前清理
        window.onbeforeunload = () => {
            if (html5QrCode) html5QrCode.clear();
        };
    </script>
</body>
</html>
