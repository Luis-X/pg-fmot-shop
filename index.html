<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全屏 H5 二维码扫码器</title>
    <!-- 引入 html5-qrcode 库 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- 引入全封装的扫码组件 JS -->
    <script src="QrScanner.js"></script>
</head>
<body>

    <!-- 挂载组件的容器 -->
    <div id="scanner-app"></div>

    <script>
        // 页面加载后直接实例化，所有 UI 和功能由 JS 内部渲染与驱动
        window.addEventListener('DOMContentLoaded', () => {
            const scanner = new QrScanner({
                containerId: "scanner-app",
                onScanSuccess: (text) => {
                    console.log("扫码成功内容:", text);
                    // 可以在这里处理业务逻辑，例如跳转或关闭
                }
            });
        });
    </script>
</body>
</html>
