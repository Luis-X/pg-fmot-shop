<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码扫描器</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            overflow: hidden;
        }
        #reader {
            width: 100%;
            height: 100vh;
        }
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.75);
            padding: 15px 30px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 14px 28px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            min-width: 140px;
        }
        #startBtn { background: #4CAF50; color: white; }
        #stopBtn  { background: #f44336; color: white; }
        .status {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    
    <div class="status" id="status"></div>
    
    <div class="controls">
        <button id="startBtn">开始扫描</button>
        <button id="stopBtn" disabled>停止扫描</button>
    </div>

    <script>
        let html5QrCode = null;

        function onScanSuccess(decodedText, decodedResult) {
            const result = `✅ 扫描成功！\n\n内容：${decodedText}`;
            
            if (confirm(result + "\n\n是否继续扫描？")) {
                return true;
            } else {
                stopScanning();
            }
        }

        function onScanError() {
            // 正常忽略
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        }

        function exitFullscreen() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }

        // 开始扫描
        function startScanning() {
            if (html5QrCode) html5QrCode.clear();

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 12,
                qrbox: { width: 260, height: 260 },   // 正方形扫描框
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                document.getElementById("status").innerHTML = "📷 全屏扫描中（正方形框）";
                document.getElementById("startBtn").disabled = true;
                document.getElementById("stopBtn").disabled = false;
                enterFullscreen();
            }).catch(err => {
                document.getElementById("status").innerHTML = 
                    `<span style="color:red;">启动失败: ${err}</span>`;
            });
        }

        // 停止扫描
        function stopScanning() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById("status").textContent = "扫描已停止";
                    document.getElementById("startBtn").disabled = false;
                    document.getElementById("stopBtn").disabled = true;
                    exitFullscreen();
                });
            }
        }

        // 按钮事件
        document.getElementById("startBtn").addEventListener("click", startScanning);
        document.getElementById("stopBtn").addEventListener("click", stopScanning);

        window.onbeforeunload = () => {
            if (html5QrCode) html5QrCode.clear();
        };
    </script>
</body>
</html>
