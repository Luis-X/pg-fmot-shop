<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5 二维码扫描</title>
    <style>
        body { margin:0; font-family: Arial; text-align:center; background:#f5f5f5;}
        #video { width:100%; max-width:400px; background:#000; }
        button { padding:12px 24px; margin:10px; font-size:16px; }
        #result { margin:20px; padding:15px; background:white; border-radius:8px; min-height:50px; }
        .error { color:red; }
    </style>
</head>
<body>
    <h1>二维码扫描</h1>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div>
        <button onclick="startCamera()">打开摄像头</button>
        <button onclick="stopCamera()">停止</button>
    </div>
    
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let stream = null;
        let scanning = false;

        async function startCamera() {
            const resultDiv = document.getElementById('result');
            
            // 检查是否支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                resultDiv.innerHTML = `<span class="error">浏览器不支持摄像头API</span>`;
                return;
            }

            try {
                if (stream) stopCamera();

                // 优先后置摄像头
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                video.srcObject = stream;
                await video.play();
                
                scanning = true;
                resultDiv.textContent = "正在扫描...";
                scanQRCode();
            } catch (err) {
                console.error(err);
                let msg = '打开摄像头失败：';
                if (err.name === 'NotAllowedError') msg += '用户拒绝了权限';
                else if (err.name === 'NotFoundError') msg += '未找到摄像头';
                else if (err.message.includes('origin')) msg += '必须使用 HTTPS 或 localhost';
                else msg += err.message;
                
                resultDiv.innerHTML = `<span class="error">${msg}</span>`;
            }
        }

        function stopCamera() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            document.getElementById('result').textContent = '';
        }

        function scanQRCode() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight || 480;
                canvas.width = video.videoWidth || 640;
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert"
                });

                if (code) {
                    document.getElementById('result').innerHTML = `
                        ✅ <strong>扫描成功！</strong><br>
                        <span style="color:green; font-size:18px;">${code.data}</span>
                    `;
                    // scanning = false; // 发现后停止扫描（可注释掉实现连续扫描）
                }
            }
            
            requestAnimationFrame(scanQRCode);
        }

        // 可选：页面加载后自动尝试打开（推荐保留按钮手动触发）
        // window.addEventListener('load', () => setTimeout(startCamera, 500));
    </script>
</body>
</html>
